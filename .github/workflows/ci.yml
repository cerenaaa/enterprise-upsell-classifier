name: CI
"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn pytest
      - run: python -c "from data.synthetic_accounts import generate_accounts; df=generate_accounts(200); assert len(df)==200; print('OK')"
      - run: python -c "from evaluation.drift_monitor import psi; import numpy as np; s=psi(np.random.rand(100), np.random.rand(100)); print(f'PSI OK: {s:.3f}')"
